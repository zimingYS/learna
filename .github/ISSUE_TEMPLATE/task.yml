name: 技术任务
description: 技术债、重构、工程化、文档等非缺陷非需求类任务
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: 用于跟踪可独立验收的工程类工作。目标必须可验收，范围封闭。

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 为什么要做？现状是什么？
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目标与验收标准
      description: 一句话目标 + 可勾选的完成判据
      placeholder: |
        - [ ] ……
        - [ ] ……
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 做什么 / 不做什么，涉及的模块或文件
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: 任务类型
      options:
        - 技术债
        - 重构
        - 工程化 / 脚本
        - 文档
        - 依赖升级
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 相关文档路径、风险、待拍板项等
