name: Bug 报告
description: 报告一个缺陷或异常行为
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈！信息越完整，问题越容易被快速定位。

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 按顺序列出可稳定复现该问题的操作
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到报错……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为正确的行为应该是什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？请附上报错信息、日志或截图
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: "OS / 浏览器 / 服务版本或 commit（如 main @ bc14f35）"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 其他上下文、临时绕过方案、可能的原因猜测等
    validations:
      required: false
