name: 功能需求
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 请描述使用场景和期望价值，帮助判断优先级与实现方式。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下、想解决什么问题？
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望方案
      description: 你希望系统如何表现？可写具体建议，也可只描述目标
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级建议
      description: 参考产品需求文档的优先级定义
      options:
        - "P0（首个可用版本必须）"
        - "P1（核心体验增强）"
        - "P2（后续扩展）"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考资料、竞品行为、界面草图等
    validations:
      required: false
