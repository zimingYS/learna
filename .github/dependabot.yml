# Dependabot：自动依赖更新与安全公告
# https://docs.github.com/code-security/dependabot
# 注意：labels 引用的标签需已存在于仓库（dependencies / chore）
version: 2
updates:
  # Rust（backend/）
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees: ["zimingYS"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "chore"]
    groups:
      # minor/patch 合并为一个 PR，减少噪音；major 单独提 PR 便于重点 review
      minor-and-patch:
        update-types: ["minor", "patch"]

  # npm（frontend/）
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees: ["zimingYS"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "chore"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # pip/uv（ai-service/）
  - package-ecosystem: pip
    directory: /ai-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees: ["zimingYS"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "chore"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions（.github/workflows/）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    assignees: ["zimingYS"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "chore"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
