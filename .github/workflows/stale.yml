# Stale bot：自动标记/关闭长期无响应的 Issue
# 策略：Issue 60 天无活动 → 标 stale，再 14 天无回应 → 关闭；PR 不自动处理
name: Stale

on:
  schedule:
    # 每天 01:30 UTC（北京时间 09:30）
    - cron: "30 1 * * *"
  workflow_dispatch:

# Actions 收紧：仅授予 issues/PR 写权限
permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          # PR 永不自动标记/关闭（-1 = 禁用）
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          # 高优先级与安全类 Issue 永不自动关闭
          exempt-issue-labels: "P0,P1,pinned,security"
          stale-issue-message: >
            此 Issue 已 60 天无活动，现标记为 stale。
            若 14 天内仍无回应将自动关闭；问题仍然存在请回复本条或移除 stale 标签。
          close-issue-message: >
            此 Issue 因长期无响应被自动关闭。
            如问题仍然存在，欢迎重新打开或新建 Issue。
          operations-per-run: 50
