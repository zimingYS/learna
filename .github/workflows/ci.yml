name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions 收紧：默认仅只读 contents，构建不需要任何写权限
permissions:
  contents: read

jobs:
  # 汇总作业：check 名固定为 CI，对齐分支保护的必需检查（单点闸门）
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend, frontend, ai-service]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "backend: ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "ai-service: ${{ needs.ai-service.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.frontend.result }}" != "success" ] \
            || [ "${{ needs.ai-service.result }}" != "success" ]; then
            exit 1
          fi

  backend:
    name: backend (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learna
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: learna
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgres://learna:devpass@localhost:5432/learna
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked -- -D warnings

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

  frontend:
    name: frontend (Vue)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  ai-service:
    name: ai-service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check app tests

      - name: Lint
        run: uv run ruff check app tests

      - name: Syntax check
        run: uv run python -m compileall app

      - name: Test
        run: uv run pytest
