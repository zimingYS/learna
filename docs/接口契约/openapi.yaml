components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer <JWT>（HS256，有效期 7 天）"

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，≥1，默认 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，1–100，默认 10
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    RecordId:
      name: id
      in: path
      required: true
      description: 记录 UUID
      schema:
        type: string
        format: uuid
    ProjectId:
      name: project_id
      in: path
      required: true
      description: 项目 UUID
      schema:
        type: string
        format: uuid
    GoalId:
      name: goal_id
      in: path
      required: true
      description: 项目目标 UUID
      schema:
        type: string
        format: uuid
    RoadmapId:
      name: roadmap_id
      in: path
      required: true
      description: 路线 UUID
      schema:
        type: string
        format: uuid
    StageId:
      name: stage_id
      in: path
      required: true
      description: 阶段 UUID
      schema:
        type: string
        format: uuid
    MilestoneId:
      name: milestone_id
      in: path
      required: true
      description: 里程碑 UUID
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      description: 任务 UUID
      schema:
        type: string
        format: uuid
    DependsOnTaskId:
      name: depends_on_task_id
      in: path
      required: true
      description: 前置任务 UUID
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: "未认证（code: UNAUTHORIZED / TOKEN_ERROR）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: "资源不存在或不属于当前用户（code: NOT_FOUND）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: "入参校验失败（code: VALIDATION_ERROR）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: "内部错误（code: INTERNAL_ERROR）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: "资源当前状态不允许该操作或状态机非法迁移（code: CONFLICT）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    EnvelopeMeta:
      type: object
      description: 统一响应信封公共字段（成功与失败都必填 request_id）
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: '"200" 表示成功；其余为稳定业务错误码'
        message:
          type: string
        request_id:
          type: string
          description: 请求追踪 ID（UUID v4，由中间件生成）

    EmptyEnvelope:
      type: object
      required: [code, message, data, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: "null"
        request_id:
          type: string

    ErrorEnvelope:
      type: object
      required: [code, message, data, request_id]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - TOKEN_ERROR
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - RATE_LIMITED
            - UPSTREAM_ERROR
            - INTERNAL_ERROR
            - HASH_ERROR
        message:
          type: string
        data:
          type: "null"
        request_id:
          type: string

    UserResponse:
      type: object
      required: [id, email, display_name]
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT
        user:
          $ref: "#/components/schemas/UserResponse"

    AuthEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/AuthResponse"

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        display_name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RecordItem:
      type: object
      description: 过渡实体，非正式 LearningSession（差异见设计记录/现有接口审计.md）
      required: [id, title, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: ["string", "null"]
        duration_minutes:
          type: ["integer", "null"]
        subject:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RecordListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecordItem"
        total:
          type: integer
          format: int64

    RecordEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/RecordItem"

    RecordListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/RecordListData"

    CreateRecordRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        content:
          type: string
        duration_minutes:
          type: integer
        subject:
          type: string

    UpdateRecordRequest:
      type: object
      description: 部分更新；全部字段可选。正式契约要求区分缺失/null/值（过渡实现当前为二态）
      properties:
        title:
          type: string
        content:
          type: ["string", "null"]
        duration_minutes:
          type: integer
        subject:
          type: ["string", "null"]

    # ==================== 学习规划模块：枚举 ====================

    ProjectStatus:
      type: string
      description: |
        PRD §4.3 确认的五态。ERD §9 枚举建议另含 deleting（受控删除流程，D-02），未纳入（D-16）。
      enum: [draft, active, paused, completed, archived]

    ProjectType:
      type: string
      description: 项目类型（ERD §5.1）
      enum: [study, skill_development, challenge, deliverable]

    DeadlineType:
      type: string
      description: none 时 deadline_at 必须为空；soft / fixed 时必填（ERD §5.1）
      enum: [none, soft, fixed]

    GoalType:
      type: string
      enum: [outcome, performance, completion]

    GoalStatus:
      type: string
      enum: [active, achieved, cancelled]

    Contribution:
      type: string
      description: 目标-阶段关联的贡献程度（ERD GoalStage）
      enum: [primary, supporting]

    RoadmapStatus:
      type: string
      enum: [draft, active, superseded]

    RoadmapSource:
      type: string
      enum: [user, ai, template]

    StageStatus:
      type: string
      enum: [pending, active, completed, skipped]

    CompletionMethod:
      type: string
      enum: [user, system_confirmed, ai_suggested]

    MilestoneStatus:
      type: string
      enum: [pending, in_progress, completed, skipped]

    TaskStatus:
      type: string
      enum: [todo, in_progress, blocked, completed, cancelled]

    CreatedSource:
      type: string
      enum: [user, ai, template]

    DependencyType:
      type: string
      description: ERD §5.1 仅定义 finish_to_start
      enum: [finish_to_start]

    # ==================== 学习规划模块：项目 ====================

    ProjectItem:
      type: object
      description: 学习项目（ERD §5.1）；owner_id 不外露（隐含为当前用户）
      required: [id, name, project_type, status, importance_level, deadline_type, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ["string", "null"]
        project_type:
          $ref: "#/components/schemas/ProjectType"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        importance_level:
          type: integer
          minimum: 1
          maximum: 5
        importance_override_until:
          type: ["string", "null"]
          format: date-time
        deadline_type:
          $ref: "#/components/schemas/DeadlineType"
        deadline_at:
          type: ["string", "null"]
          format: date-time
        archived_at:
          type: ["string", "null"]
          format: date-time
        reopened_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectItem"
        total:
          type: integer
          format: int64

    ProjectEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ProjectItem"

    ProjectListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ProjectListData"

    CreateProjectRequest:
      type: object
      description: status 不可指定（初始 draft）；importance_level 默认值待决策（D-19）
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        project_type:
          $ref: "#/components/schemas/ProjectType"
        importance_level:
          type: integer
          minimum: 1
          maximum: 5
        importance_override_until:
          type: string
          format: date-time
        deadline_type:
          $ref: "#/components/schemas/DeadlineType"
        deadline_at:
          type: string
          format: date-time

    UpdateProjectRequest:
      type: object
      description: |
        部分更新。status 与 owner 不在可更新字段内；deadline_type=fixed 时修改 deadline_at 返回 422（D-04）。
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        project_type:
          $ref: "#/components/schemas/ProjectType"
        importance_level:
          type: integer
          minimum: 1
          maximum: 5
        importance_override_until:
          type: ["string", "null"]
          format: date-time
        deadline_type:
          $ref: "#/components/schemas/DeadlineType"
        deadline_at:
          type: ["string", "null"]
          format: date-time

    # ==================== 学习规划模块：目标 ====================

    GoalItem:
      type: object
      description: 项目目标（ERD §5.1）
      required: [id, project_id, title, goal_type, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: ["string", "null"]
        goal_type:
          $ref: "#/components/schemas/GoalType"
        target_definition:
          type: [object, "null"]
          description: 结构化目标定义（JSONB）；内部结构未锁定，契约不约束（D-08）
        status:
          $ref: "#/components/schemas/GoalStatus"
        target_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GoalListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GoalItem"
        total:
          type: integer
          format: int64

    GoalEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/GoalItem"

    GoalListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/GoalListData"

    CreateGoalRequest:
      type: object
      description: status 不可指定（初始 active）
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        goal_type:
          $ref: "#/components/schemas/GoalType"
        target_definition:
          type: object
        target_at:
          type: string
          format: date-time

    UpdateGoalRequest:
      type: object
      description: 部分更新；status 仅允许 active → achieved / cancelled（D-07）
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        goal_type:
          $ref: "#/components/schemas/GoalType"
        target_definition:
          type: ["object", "null"]
        target_at:
          type: ["string", "null"]
          format: date-time
        status:
          $ref: "#/components/schemas/GoalStatus"

    GoalStageItem:
      type: object
      description: 目标-阶段关联行（ERD GoalStage，复合主键）；不展开阶段详情
      required: [goal_id, stage_id, contribution]
      properties:
        goal_id:
          type: string
          format: uuid
        stage_id:
          type: string
          format: uuid
        contribution:
          $ref: "#/components/schemas/Contribution"

    GoalStageListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/GoalStageItem"

    GoalStageEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/GoalStageItem"

    UpsertGoalStageRequest:
      type: object
      description: 幂等写入关联（复合主键决定）
      required: [contribution]
      properties:
        contribution:
          $ref: "#/components/schemas/Contribution"

    # ==================== 学习规划模块：路线与阶段 ====================

    RoadmapItem:
      type: object
      description: 项目路线（版本化，ERD §5.1）
      required: [id, project_id, version, status, source, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        version:
          type: integer
        status:
          $ref: "#/components/schemas/RoadmapStatus"
        source:
          $ref: "#/components/schemas/RoadmapSource"
        change_summary:
          type: ["string", "null"]
        confirmed_at:
          type: ["string", "null"]
          format: date-time
        created_by:
          type: ["string", "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RoadmapListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapItem"
        total:
          type: integer
          format: int64

    RoadmapEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/RoadmapItem"

    RoadmapListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/RoadmapListData"

    CreateRoadmapRequest:
      type: object
      description: version 与 status 由服务端决定；source=ai 须经 AI 提案与用户确认流程（本模块范围外）
      properties:
        source:
          type: string
          enum: [user, template]
        change_summary:
          type: string

    UpdateRoadmapRequest:
      type: object
      description: 仅 draft 可编辑；status 与 version 不可直接修改（status 走 confirm）
      properties:
        change_summary:
          type: ["string", "null"]

    StageItem:
      type: object
      description: 路线阶段（ERD §5.1）
      required: [id, roadmap_id, name, sequence_no, status, completion_method, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        roadmap_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ["string", "null"]
        sequence_no:
          type: integer
        status:
          $ref: "#/components/schemas/StageStatus"
        completion_rule:
          type: [object, "null"]
          description: 可选完成条件（JSONB）；内部结构未锁定（D-08）
        completion_method:
          $ref: "#/components/schemas/CompletionMethod"
        started_at:
          type: ["string", "null"]
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StageListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/StageItem"

    StageEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/StageItem"

    CreateStageRequest:
      type: object
      description: sequence_no 省略时追加到路线末尾；status 初始 pending
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        sequence_no:
          type: integer
        completion_rule:
          type: object

    UpdateStageRequest:
      type: object
      description: 状态必须走动作端点（start / complete / skip / reactivate）
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        sequence_no:
          type: integer
        completion_rule:
          type: ["object", "null"]

    # ==================== 学习规划模块：里程碑 ====================

    MilestoneItem:
      type: object
      description: 里程碑（ERD §5.1）
      required: [id, stage_id, title, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        stage_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/MilestoneStatus"
        completion_rule:
          type: [object, "null"]
          description: 可选完成条件（JSONB）；内部结构未锁定（D-08）
        completed_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MilestoneListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MilestoneItem"
        total:
          type: integer
          format: int64

    MilestoneEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/MilestoneItem"

    MilestoneListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/MilestoneListData"

    CreateMilestoneRequest:
      type: object
      description: stage_id 必填（里程碑必属阶段）；status 初始 pending
      required: [stage_id, title]
      properties:
        stage_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        completion_rule:
          type: object

    UpdateMilestoneRequest:
      type: object
      description: 状态迁移边待决策（D-11）
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        completion_rule:
          type: ["object", "null"]
        status:
          $ref: "#/components/schemas/MilestoneStatus"

    # ==================== 学习规划模块：任务与依赖 ====================

    TaskItem:
      type: object
      description: 学习任务（ERD §5.1）
      required: [id, project_id, title, status, priority, created_source, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        milestone_id:
          type: ["string", "null"]
          format: uuid
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          type: integer
          minimum: 1
          maximum: 5
        due_at:
          type: ["string", "null"]
          format: date-time
        estimated_minutes:
          type: ["integer", "null"]
          minimum: 0
        completed_at:
          type: ["string", "null"]
          format: date-time
        created_source:
          $ref: "#/components/schemas/CreatedSource"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskItem"
        total:
          type: integer
          format: int64

    TaskEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/TaskItem"

    TaskListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/TaskListData"

    CreateTaskRequest:
      type: object
      description: milestone_id 可空；created_source 固定 user；status 初始 todo；priority 默认值待决策（D-19）
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        milestone_id:
          type: string
          format: uuid
        priority:
          type: integer
          minimum: 1
          maximum: 5
        due_at:
          type: string
          format: date-time
        estimated_minutes:
          type: integer
          minimum: 0

    UpdateTaskRequest:
      type: object
      description: 状态迁移边待决策（D-11）；进入 completed 时服务端写 completed_at
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        milestone_id:
          type: ["string", "null"]
          format: uuid
        priority:
          type: integer
          minimum: 1
          maximum: 5
        due_at:
          type: ["string", "null"]
          format: date-time
        estimated_minutes:
          type: ["integer", "null"]
          minimum: 0
        status:
          $ref: "#/components/schemas/TaskStatus"

    TaskDependencyItem:
      type: object
      description: 任务依赖行（ERD TaskDependency，复合主键，无独立 id）
      required: [task_id, depends_on_task_id, dependency_type]
      properties:
        task_id:
          type: string
          format: uuid
          description: 后继任务
        depends_on_task_id:
          type: string
          format: uuid
          description: 前置任务
        dependency_type:
          $ref: "#/components/schemas/DependencyType"

    TaskDependencyEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/TaskDependencyItem"

    TaskDependencyListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/TaskDependencyItem"

    CreateTaskDependencyRequest:
      type: object
      description: 两任务须同属该项目；禁止自依赖与环路（ERD §5.1）
      required: [depends_on_task_id]
      properties:
        depends_on_task_id:
          type: string
          format: uuid
        dependency_type:
          $ref: "#/components/schemas/DependencyType"
