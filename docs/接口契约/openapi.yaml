        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [goals]
      summary: 删除目标（achieved 拒绝）
      description: |
        物理删除目标，并在同一事务内删除其 GoalStage 关联行（关联行不是业务对象，D-07a）。

        `status=achieved` 返回 409：达成是成果事实，删除后不可追溯；如需清理展示，保留目标并改状态。
        `active` / `cancelled` 允许删除（「建错了」或「不做了」）。

        子目标：删除**主目标**时其下子目标一并删除，须显式 `?cascade=true`，否则返回 409 并在
        `data.impact.goals` 给出计数（D-21）。**不采用**把子目标 `parent_goal_id` 置 NULL 的做法——
        那会把子目标升格为主目标，破坏「每项目最多一个主目标」（D-06）。删除子目标本身无此要求。
      parameters:
        - $ref: "#/components/parameters/Cascade"
      responses:
        "200":
          description: 删除成功（data 为 null）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictWithImpact"

