openapi: 3.1.0
info:
  title: Learna API
  version: "1.1.0"
  description: |
    Learna 接口契约（已确认接口）。

    - 全局规范见 docs/接口契约/README.md；业务目录见 docs/接口契约/接口清单.md。
    - `/api/v1/records` 为**过渡实现**（x-learna-status: interim），不是正式 LearningSession 契约。
    - 学习规划模块（projects / goals / roadmaps / stages / milestones / tasks）为**已设计、未实现**
      （x-learna-status: designed），依据见 docs/接口契约/设计记录/学习规划模块契约设计.md。
    - 其余未确认业务接口（learning-sessions / mastery / reviews / AI 提案等）不收录于此。
  license:
    name: PolyForm Noncommercial 1.0.0
servers:
  - url: http://localhost:8080
    description: 本地开发（经 vite/nginx 代理时为 /api/v1 相对路径）
security:
  - bearerAuth: []
tags:
  - name: infrastructure
    description: 基础设施端点（不版本化）
  - name: auth
    description: 认证
  - name: records
    description: 学习记录（过渡实现，非正式 LearningSession 契约）
  - name: projects
    description: 学习项目（已设计，未实现）
  - name: goals
    description: 项目目标与目标-阶段关联（已设计，未实现）
  - name: roadmaps
    description: 项目路线，版本化（已设计，未实现）
  - name: stages
    description: 路线阶段（已设计，未实现）
  - name: milestones
    description: 里程碑（已设计，未实现）
  - name: tasks
    description: 学习任务与前置依赖（已设计，未实现）

paths:
  /healthz:
    get:
      tags: [infrastructure]
      summary: 存活探针
      security: []
      responses:
        "200":
          description: 存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"

  /readyz:
    get:
      tags: [infrastructure]
      summary: 就绪探针（检查数据库连接）
      security: []
      responses:
        "200":
          description: 就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: 用户注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 注册成功，返回 JWT 与用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，返回 JWT 与用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/records:
    get:
      tags: [records]
      summary: 学习记录分页列表（过渡实现）
      x-learna-status: interim
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页列表（items 按 created_at DESC）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [records]
      summary: 创建学习记录（过渡实现）
      x-learna-status: interim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/records/{id}:
    parameters:
      - $ref: "#/components/parameters/RecordId"
    get:
      tags: [records]
      summary: 学习记录详情（过渡实现）
      x-learna-status: interim
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [records]
      summary: 部分更新学习记录（过渡实现）
      description: |
        PATCH 三态语义（ADR-002）：字段缺失＝不变；显式 null＝置空；值＝更新。
        过渡实现当前为二态（缺失与显式 null 均视为不修改），三态对齐属待决策。
      x-learna-status: interim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecordRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [records]
      summary: 删除学习记录（过渡实现，物理删除）
      description: 删除语义与正式模型（保留历史、更正需审计）不一致，属待决策。
      x-learna-status: interim
      responses:
        "200":
          description: 删除成功（data 为 null）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==================== 学习规划模块（已设计，未实现） ====================
  # 统一标记 x-learna-status: designed；待决策端点不收录（见设计记录 §10）。

  /api/v1/projects:
    x-learna-module: learning-planning
    x-learna-status: designed
    get:
      tags: [projects]
      summary: 项目列表
      description: "默认排除已归档（PRD §4.3）；排序固定 updated_at DESC（ERD §7 索引建议）；传 status=archived 可查归档项目。"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          description: 按项目状态过滤
          schema:
            $ref: "#/components/schemas/ProjectStatus"
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [projects]
      summary: 创建项目
      description: "初始状态 draft（PRD §4.3）。"
      x-learna-open-question: "创建成功状态码 200 vs 201 待决策（接口清单 §5.4）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      summary: 项目详情
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [projects]
      summary: 部分更新项目
      description: |
        字段语义按 ADR-002 三态（缺失＝不变、null＝置空、值＝更新）；跨模块落地范围待统一（接口清单 §5.2）。
        状态不可经 PATCH 修改，必须走动作端点。deadline_type=fixed 时修改 deadline_at 返回 422（特殊确认流程待决策 D-04）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}/activate:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 开始项目（草稿 → 进行中）
      responses:
        "200":
          description: 状态已变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/pause:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 暂停项目（进行中 → 暂停）
      responses:
        "200":
          description: 状态已变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/resume:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 恢复项目（暂停 → 进行中）
      responses:
        "200":
          description: 状态已变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/complete:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 完成项目（进行中 → 已完成）
      responses:
        "200":
          description: 状态已变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/reopen:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 重新开启项目（已完成 / 已归档 → 进行中）
      description: "写 reopened_at；已归档时清空 archived_at；保留全部历史数据（PRD §4.3）。"
      responses:
        "200":
          description: 状态已变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/archive:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 归档项目
      description: "写 archived_at；不级联删除子数据（ERD D-05）。"
      responses:
        "200":
          description: 状态已变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/goals:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [goals]
      summary: 项目目标列表
      description: "排序无 ERD 依据，暂用 created_at DESC（待决策 D-14）。"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [goals]
      summary: 创建项目目标
      description: "初始状态 active（ERD §5.1）。"
      x-learna-open-question: "创建成功状态码 200 vs 201 待决策（接口清单 §5.4）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}/goals/{goal_id}:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/GoalId"
    get:
      tags: [goals]
      summary: 目标详情
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [goals]
      summary: 部分更新目标（含 active → achieved / cancelled）
      description: "achieved / cancelled 不可回退到 active（恢复语义待决策 D-07）；非法迁移返回 409。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}/goals/{goal_id}/stages:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/GoalId"
    get:
      tags: [goals]
      summary: 目标关联的阶段列表
      description: "返回 GoalStage 关联行（goal_id / stage_id / contribution），不展开阶段详情。"
      responses:
        "200":
          description: 关联列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalStageListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/goals/{goal_id}/stages/{stage_id}:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/GoalId"
      - $ref: "#/components/parameters/StageId"
    put:
      tags: [goals]
      summary: 建立或更新目标-阶段关联（幂等）
      description: "复合主键 (goal_id, stage_id) 决定幂等语义；目标与阶段须同属该项目。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertGoalStageRequest"
      responses:
        "200":
          description: 关联已写入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalStageEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [goals]
      summary: 解除目标-阶段关联
      description: "仅删除关联行，不删除目标或阶段。"
      responses:
        "200":
          description: 解除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/roadmaps:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [roadmaps]
      summary: 路线版本历史
      description: "含 superseded 版本（ERD §8 保留路线历史）；排序 version DESC（ERD §7）。"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [roadmaps]
      summary: 创建路线草稿
      description: "version 由服务端按项目自增；status 初始 draft。"
      x-learna-open-question: "创建成功状态码 200 vs 201 待决策（接口清单 §5.4）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoadmapRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}/roadmaps/{roadmap_id}:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RoadmapId"
    get:
      tags: [roadmaps]
      summary: 路线详情
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [roadmaps]
      summary: 部分更新路线
      description: "仅 draft 可编辑；active / superseded 返回 409。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoadmapRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}/roadmaps/{roadmap_id}/confirm:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RoadmapId"
    post:
      tags: [roadmaps]
      summary: 确认路线（draft → active）
      description: |
        单事务完成：同项目原 active 路线置 superseded → 目标路线置 active 并写 confirmed_at。
        保证「一个项目最多一个 active roadmap」（ERD §5.1）。非 draft 返回 409。
      responses:
        "200":
          description: 确认成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/roadmaps/{roadmap_id}/stages:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RoadmapId"
    get:
      tags: [stages]
      summary: 阶段列表
