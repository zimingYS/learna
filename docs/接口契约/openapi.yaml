openapi: 3.1.0
info:
  title: Learna API
  version: "1.5.0"
  description: |
    Learna 接口契约（已确认接口）。

    - 全局规范见 docs/接口契约/README.md；业务目录见 docs/接口契约/接口清单.md。
    - `/api/v1/records` 为**过渡实现**（x-learna-status: interim），不是正式 LearningSession 契约。
    - 学习规划模块（projects / goals / roadmaps / stages / milestones / tasks）为**已设计、未实现**
      （x-learna-status: designed），依据见 docs/接口契约/设计记录/学习规划模块契约设计.md；
      该模块 23 项决策已全部落定（ADR-005 / ADR-006 / ADR-007），无待决策项。
    - 删除语义按四层划分（ADR-006）：draft 容器级物理删除、已生效结构不提供删除、任务软删除、
      成果对象禁止删除。带子项的删除默认 409 并返回影响面，需显式 `?cascade=true`；删主目标时
      子目标随之一并删除，**不**升格为主目标。
    - 状态迁移统一规则（ADR-007）：允许跳过中间态、允许回退、终态之间不直转、同态提交幂等。
      该规则**仅适用于以 PATCH status 驱动的里程碑与任务**；阶段走 `start / complete / skip /
      reactivate` 四动作端点，`pending` 不能直接 `complete`（须先 `start`），回退目标固定为 `active`。
    - **契约最小承诺**（ADR-007）：`completion_rule` / `target_definition` 等无生产者的 JSONB 字段
      不进契约；软删除标记 `deleted_at` 不对外暴露；列表默认序固定，不提供 `sort` 参数。
    - 学习内容模块（learning-contents / content-tags / project-contents）为**已设计、未实现**
      （x-learna-status: designed），依据见 docs/接口契约/设计记录/内容与知识库契约设计.md；
      7 项决策已落定（D-23 ~ D-29），无待决策项。
    - 正文模型按 ADR-009：`body` 是 Markdown / 纯文本**源文本**，后端不渲染不净化；列表接口
      不返回 `body`，只有详情返回；`metadata` 在 v1 不可读写，出现即 422；内容域不带附件
      （附件归 M09 成果 / M05 证据）。
    - 掌握结论（`project_contents.current_status = achieved`）只能由评价流程写入：用户提交
      `achieved` 返回 409（D-27），与 ADR-007 的动作型状态迁移刻意不同。
    - 其余未确认业务接口（learning-sessions / mastery / reviews / AI 提案等）不收录于此。
  license:
    name: PolyForm Noncommercial 1.0.0
servers:
  - url: http://localhost:8080
    description: 本地开发（经 vite/nginx 代理时为 /api/v1 相对路径）
security:
  - bearerAuth: []
tags:
  - name: infrastructure
    description: 基础设施端点（不版本化）
  - name: auth
    description: 认证
  - name: records
    description: 学习记录（过渡实现，非正式 LearningSession 契约）
  - name: projects
    description: 学习项目（已设计，未实现）
  - name: goals
    description: 项目目标与目标-阶段关联（已设计，未实现）
  - name: roadmaps
    description: 项目路线，版本化（已设计，未实现）
  - name: stages
    description: 路线阶段（已设计，未实现）
  - name: milestones
    description: 里程碑（已设计，未实现）
  - name: tasks
    description: 学习任务与前置依赖（已设计，未实现）
  - name: contents
    description: 学习内容本体、内容关系与正文（已设计，未实现）
  - name: content-tags
    description: 内容标签词表与内容打标（已设计，未实现）
  - name: project-contents
    description: 内容与项目的关联上下文（已设计，未实现）

paths:
  /healthz:
    get:
      tags: [infrastructure]
      summary: 存活探针
      security: []
      responses:
        "200":
          description: 存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"

  /readyz:
    get:
      tags: [infrastructure]
      summary: 就绪探针（检查数据库连接）
      security: []
      responses:
        "200":
          description: 就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: 用户注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 注册成功，返回 JWT 与用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，返回 JWT 与用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/records:
    get:
      tags: [records]
      summary: 学习记录分页列表（过渡实现）
      x-learna-status: interim
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页列表（items 按 created_at DESC）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [records]
      summary: 创建学习记录（过渡实现）
      x-learna-status: interim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/records/{id}:
    parameters:
      - $ref: "#/components/parameters/RecordId"
    get:
      tags: [records]
      summary: 学习记录详情（过渡实现）
      x-learna-status: interim
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [records]
      summary: 部分更新学习记录（过渡实现）
      description: |
        PATCH 三态语义（ADR-002）：字段缺失＝不变；显式 null＝置空；值＝更新。
        过渡实现当前为二态（缺失与显式 null 均视为不修改），三态对齐属待决策。
      x-learna-status: interim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecordRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [records]
      summary: 删除学习记录（过渡实现，物理删除）
      description: 删除语义与正式模型（保留历史、更正需审计）不一致，属待决策。
      x-learna-status: interim
      responses:
        "200":
          description: 删除成功（data 为 null）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==================== 学习规划模块（已设计，未实现） ====================
  # 统一标记 x-learna-status: designed；已设计端点全部收录，无 ❓ 端点（设计记录 §10）。

  /api/v1/projects:
    x-learna-module: learning-planning
    x-learna-status: designed
    get:
      tags: [projects]
      summary: 项目列表
      description: "默认排除已归档（PRD §4.3，D-15）；排序固定 updated_at DESC, id DESC（ERD §7 索引建议）。查归档项目须显式传 include_archived=true。"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          description: 按项目状态过滤（单值；不支持多值，以免破坏 (owner_id, status, updated_at DESC) 索引）
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - name: include_archived
          in: query
          required: false
          description: 为 true 时结果包含 archived 项目（与 status 互不排斥，取交集）
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [projects]
      summary: 创建项目
      description: "初始状态 draft（PRD §4.3）。"
      x-learna-open-question: "创建成功状态码 200 vs 201 待决策（接口清单 §5 第 4 项）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      summary: 项目详情
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [projects]
      summary: 部分更新项目
      description: |
        字段语义按 ADR-002 三态（缺失＝不变、null＝置空、值＝更新）；跨模块落地范围待统一（接口清单 §5.2）。
        状态不可经 PATCH 修改，必须走动作端点。deadline_type=fixed 时修改 deadline_at 返回 422，
        须改走 POST /projects/{id}/extend-deadline（D-04）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [projects]
      summary: 删除项目（仅草稿，级联物理删除）
      description: |
        仅 `status=draft` 允许，级联**物理删除**全部规划数据（goal / roadmap / stage / milestone / task /
        goal_stage / task_dependency），单事务完成（D-02a / ADR-006）。

        已实施项目（active / paused / completed / archived）返回 409：首选归档（`POST .../archive`）；
        确需销毁时调用 `POST /projects/{project_id}/purge` 并重输项目名。

        草稿项目不因存在子数据而拒绝（D-03）：草稿内子数据均为编辑中空壳，故本端点不需要 `cascade` 参数。
      responses:
        "200":
          description: 删除成功（data 为 null）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/activate:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 开始项目（草稿 → 进行中）
      responses:
        "200":
          description: 状态已变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/pause:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 暂停项目（进行中 → 暂停）
      responses:
        "200":
          description: 状态已变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/resume:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 恢复项目（暂停 → 进行中）
      responses:
        "200":
          description: 状态已变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/complete:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 完成项目（进行中 → 已完成）
      responses:
        "200":
          description: 状态已变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/reopen:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 重新开启项目（已完成 / 已归档 → 进行中）
      description: "写 reopened_at；已归档时清空 archived_at；保留全部历史数据（PRD §4.3）。"
      responses:
        "200":
          description: 状态已变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/archive:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 归档项目
      description: "写 archived_at；不级联删除子数据（ERD D-05）。"
      responses:
        "200":
          description: 状态已变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/projects/{project_id}/extend-deadline:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 修改 fixed 截止日期（特殊确认流程）
      description: |
        ERD §5.1「fixed 日期修改必须走特殊确认流程」的落地形态（D-04 已决策）。
        仅对 deadline_type=fixed 的项目有效；必须提供原因，服务端写审计事件。
        非 fixed 项目改期走 PATCH /projects/{id}。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendDeadlineRequest"
      responses:
        "200":
          description: 截止日期已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}/purge:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      tags: [projects]
      summary: 强制删除项目（任意状态，需重输项目名）
      description: |
        已实施项目的销毁入口（D-02b / ERD §8.1）。与 `DELETE /projects/{id}` 的区别：
        后者只删草稿且幂等；本端点接受任意状态，但要求 `confirm_name` 与项目 `name` 完全一致，
        不一致返回 422（模拟 GitHub 删仓库的二次确认）。

        事务内流程：`status=deleting` 加行锁拦截并发写 → 级联物理删除规划域数据 → 删除项目行 →
        落结构化快照日志（含被删对象计数）。`deleting` 不持久可见。

        **v1 只删规划域数据**：`purge` 不触及学习记录（LearningSession 未设计；该处置选项 D-20 已移交 P1）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeProjectRequest"
      responses:
        "200":
          description: 删除成功（data 为 null）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}/goals:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [goals]
      summary: 项目目标列表
      description: "排序固定 created_at ASC, id ASC（无索引依据，量级小；不提供 sort 参数，D-14）。"
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [goals]
      summary: 创建项目目标
      description: "初始状态 active（ERD §5.1）。"
      x-learna-open-question: "创建成功状态码 200 vs 201 待决策（接口清单 §5 第 4 项）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}/goals/{goal_id}:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/GoalId"
    get:
      tags: [goals]
      summary: 目标详情
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [goals]
      summary: 部分更新目标（含状态变更）
      description: |
        状态边（D-07b）：`active → achieved / cancelled`；`achieved → active`、`cancelled → active`（误判修正）。
        `achieved → cancelled` 返回 409（须先回 active 再取消，保留判定的两步痕迹）；其余迁移 409。
