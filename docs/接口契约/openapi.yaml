      x-learna-open-question: "创建成功状态码 200 vs 201 待决策（接口清单 §5 第 4 项）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}/tasks/{task_id}:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      summary: 任务详情
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [tasks]
      summary: 部分更新任务（含状态）
      description: |
        状态迁移按统一规则校验（ADR-007）：允许跳过中间态、允许回退、终态之间不直转、
        同态提交幂等 200；进入 completed 写 completed_at，离开时清空。
        进入 completed 时服务端写 completed_at，离开 completed 时清空。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [tasks]
      summary: 删除任务（软删除）
      description: |
        `deleted_at` 标记 + 列表过滤；同一事务物理删除其依赖行（关联行，非业务对象）。
        任务不提供物理删除：它是唯一承载执行历史（`completed_at`）的对象（ADR-006）。
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{project_id}/tasks/{task_id}/dependencies:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      summary: 任务的前置依赖列表
      responses:
        "200":
          description: 依赖列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDependencyListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [tasks]
      summary: 新增前置依赖
      description: |
        校验两任务同属一个项目、禁止自依赖、环路检测（含新增边），单事务完成（ERD §5.1 TaskDependency）。
        违反返回 422；并发成环冲突返回 409。
      x-learna-open-question: "创建成功状态码 200 vs 201 待决策（接口清单 §5 第 4 项）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskDependencyRequest"
      responses:
        "200":
          description: 依赖已建立
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDependencyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}/tasks/{task_id}/dependencies/{depends_on_task_id}:
    x-learna-module: learning-planning
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/TaskId"
      - $ref: "#/components/parameters/DependsOnTaskId"
    delete:
      tags: [tasks]
      summary: 解除前置依赖
      responses:
        "200":
          description: 解除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ==================== M03 学习内容域 ====================

  /api/v1/learning-contents:
    x-learna-module: learning-content
    x-learna-status: designed
    get:
      tags: [contents]
      summary: 内容列表
      description: |
        分页列表，**不返回 `body`**（正文只在详情返回，避免响应随内容体量膨胀）。
        排序固定 `updated_at DESC, id DESC`；默认只返回 `active`。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: content_type
          in: query
          description: 按内容类型过滤
          schema:
            $ref: "#/components/schemas/ContentType"
        - name: status
          in: query
          description: active（默认）/ archived / all
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - name: parent_id
          in: query
          description: 直接子节点；与 root_only 互斥（同时给出返回 422）
          schema:
            type: string
            format: uuid
        - name: root_only
          in: query
          description: 只返回根节点（`parent_id IS NULL`）；与 parent_id 互斥
          schema:
            type: boolean
            default: false
        - name: q
          in: query
          description: 标题包含匹配（大小写不敏感）；相似度提示见创建接口的 similar_hints
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [contents]
      summary: 创建内容
      description: |
        `similar_hints` 仅为提示，创建**必定成功**（ERD §3.1：不建 `(owner_id, title)` 唯一约束）。
        `metadata` 在 v1 不可写，请求体出现即 422（ADR-009 §3）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContentRequest"
      responses:
        "200":
          description: 创建成功（含相似内容提示）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentCreateEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/learning-contents/{content_id}:
    x-learna-module: learning-content
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ContentId"
    get:
      tags: [contents]
      summary: 内容详情
      description: 唯一返回 `body` 的端点；同时返回 `depth`（树深度，界面据此提示层级建议）。
      responses:
        "200":
          description: 内容详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [contents]
      summary: 更新内容
      description: |
        部分更新（三态：字段缺失＝不变 / `null`＝置空 / 值＝更新）。
        `status`、`created_source`、`metadata` 不可写；提交 `parent_id` 会做同归属、不成环、
        深度 ≤ 10 三项校验。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [contents]
      summary: 归档内容（或彻底删除）
      description: |
        默认**归档**（`status=archived`），幂等；不触碰 `project_contents` 与 `content_relations`
        —— 已关联的项目上下文保留（M03 §6）。

        `purge=true` 为物理删除，需同时满足：已归档、`project_contents` 引用为 0、无子内容；
        否则 409 并在 `data` 返回影响面（ADR-006 / D-22 明文例外）。**不提供级联删除**。
      parameters:
        - name: purge
          in: query
          description: 物理删除（不可恢复）；前置条件不满足返回 409
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 已归档 / 已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictWithImpact"

  /api/v1/learning-contents/{content_id}/relations:
    x-learna-module: learning-content
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ContentId"
    get:
      tags: [contents]
      summary: 内容关系列表
      description: |
        单向存储、双向查询（D-25）：`direction=all` 时同时返回出边与入边，每条标注方向。
        不分页，单内容关系数上限 200（超出返回 422）。
      parameters:
        - name: relation_type
          in: query
          schema:
            $ref: "#/components/schemas/RelationType"
        - name: direction
          in: query
          description: outbound 出边 / inbound 入边 / all 双向（默认）
          schema:
            type: string
            enum: [outbound, inbound, all]
            default: all
      responses:
        "200":
          description: 关系列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [contents]
      summary: 建立内容关系
      description: |
        重复关系幂等返回 200（不新增行）；自引用、跨用户、`prerequisite` 成环分别返回
        422 / 422 / 422，错误 `message` 说明具体原因。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelationRequest"
      responses:
        "200":
          description: 建立成功（或已存在）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/learning-contents/{content_id}/relations/{relation_id}:
    x-learna-module: learning-content
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ContentId"
      - $ref: "#/components/parameters/RelationId"
    delete:
      tags: [contents]
      summary: 删除内容关系
      description: 物理删除；关系不属于该内容时 404。
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/learning-contents/{content_id}/tags:
    x-learna-module: learning-content
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ContentId"
    get:
      tags: [content-tags]
      summary: 内容已打标签
      description: 不分页，单内容标签数上限 20。
      responses:
        "200":
          description: 标签列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentTagListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [content-tags]
      summary: 整体替换内容标签
      description: |
        整体替换（幂等）：空数组表示清空。`tag_ids` 含他人标签 → 404；含重复 id → 422。
        不用 POST/DELETE 逐条增删（D-28：前端只需提交一次多选结果，不必维护差集）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetContentTagsRequest"
      responses:
        "200":
          description: 替换后的标签列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentTagListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/content-tags:
    x-learna-module: learning-content
    x-learna-status: designed
    get:
      tags: [content-tags]
      summary: 标签列表
      description: 用户私有词表；排序固定 `name ASC`（词表顺序要稳定）。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          description: 名称包含匹配
          schema:
            type: string
            maxLength: 60
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentTagListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [content-tags]
      summary: 创建标签
      description: 同名标签已存在时返回 409（不静默返回既有标签，避免掩盖同名不同义）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContentTagRequest"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentTagEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/content-tags/{tag_id}:
    x-learna-module: learning-content
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ContentTagId"
    patch:
      tags: [content-tags]
      summary: 更新标签
      description: 改名撞已有名 → 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentTagRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentTagEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [content-tags]
      summary: 删除标签
      description: 物理删除；`learning_content_tags` 关联行随外键级联清理。
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/project-contents:
    x-learna-module: learning-content
    x-learna-status: designed
    get:
      tags: [project-contents]
      summary: 项目内容关联列表
      description: |
        `project_id` 与 `content_id` **二选一必填**：前者用于项目详情页，后者用于「这份内容在哪些
        项目里、到哪一步了」的跨项目复用查询（M03 §1）。两者都缺或都给 → 422。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: project_id
          in: query
          description: 按项目过滤（与 content_id 互斥）
          schema:
            type: string
            format: uuid
        - name: content_id
          in: query
          description: 按内容过滤（与 project_id 互斥）
          schema:
            type: string
            format: uuid
        - name: current_status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectContentStatus"
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectContentListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [project-contents]
      summary: 内容加入项目
      description: |
        归属校验写进 `INSERT … SELECT … WHERE owner`，三方（项目 / 内容 / 当前用户）任一不符 → 404。
        重复关联幂等返回 200（`UNIQUE(project_id, content_id)` + `ON CONFLICT DO NOTHING`）。
        已归档内容 → 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectContentRequest"
      responses:
        "200":
          description: 关联成功（或已存在）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectContentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/project-contents/{project_content_id}:
    x-learna-module: learning-content
    x-learna-status: designed
    parameters:
      - $ref: "#/components/parameters/ProjectContentId"
    get:
      tags: [project-contents]
      summary: 关联详情
      responses:
        "200":
          description: 关联详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectContentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [project-contents]
      summary: 更新项目内状态与目标
      description: |
        `current_status` 只允许 `not_started` / `learning` / `reviewing` / `waived`；提交
        `achieved` → 409（掌握结论由 M06 评价流程写入，D-27）。同态提交幂等 200 且不刷新
        `updated_at`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectContentRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectContentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [project-contents]
      summary: 解除内容与项目的关联
      description: 物理删除关联行；**不删内容本体**，也不动 `content_relations`。
      responses:
        "200":
          description: 解除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer <JWT>（HS256，有效期 7 天）"

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，≥1，默认 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，1–100，默认 10
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    RecordId:
      name: id
      in: path
      required: true
      description: 记录 UUID
      schema:
        type: string
        format: uuid
    ProjectId:
      name: project_id
      in: path
      required: true
      description: 项目 UUID
      schema:
        type: string
        format: uuid
    GoalId:
      name: goal_id
      in: path
      required: true
      description: 项目目标 UUID
      schema:
        type: string
        format: uuid
    RoadmapId:
      name: roadmap_id
      in: path
      required: true
      description: 路线 UUID
      schema:
        type: string
        format: uuid
    StageId:
      name: stage_id
      in: path
      required: true
      description: 阶段 UUID
      schema:
        type: string
        format: uuid
    MilestoneId:
      name: milestone_id
      in: path
      required: true
      description: 里程碑 UUID
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      description: 任务 UUID
      schema:
        type: string
        format: uuid
    DependsOnTaskId:
      name: depends_on_task_id
      in: path
      required: true
      description: 前置任务 UUID
      schema:
        type: string
        format: uuid
    ContentId:
      name: content_id
      in: path
      required: true
      description: 学习内容 UUID
      schema:
        type: string
        format: uuid
    RelationId:
      name: relation_id
      in: path
      required: true
      description: 内容关系 UUID
      schema:
        type: string
        format: uuid
    ContentTagId:
      name: tag_id
      in: path
      required: true
      description: 内容标签 UUID
      schema:
        type: string
        format: uuid
    ProjectContentId:
      name: project_content_id
      in: path
      required: true
      description: 项目-内容关联 UUID
      schema:
        type: string
        format: uuid
    Cascade:
      name: cascade
      in: query
      required: false
      description: |
        显式确认级联删除（D-21 / ADR-006）。缺省 false：存在子项时返回 409 并在 `data.impact`
        给出计数；置 true 时执行级联。级联范围因资源而异：路线 / 阶段 / 里程碑删除时**任务只解挂
        不删除**；目标删除时**子目标随主目标一并删除**（不升格为主目标）。
      schema:
        type: boolean
        default: false

  responses:
    Unauthorized:
      description: "未认证（code: UNAUTHORIZED / TOKEN_ERROR）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: "资源不存在或不属于当前用户（code: NOT_FOUND）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: "入参校验失败（code: VALIDATION_ERROR）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: "内部错误（code: INTERNAL_ERROR）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: "资源当前状态不允许该操作或状态机非法迁移（code: CONFLICT）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ConflictWithImpact:
      description: "状态/级联冲突，且携带删除影响面（code: CONFLICT；data 为 DeletionConflict）"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeletionConflictEnvelope"

  schemas:
    EnvelopeMeta:
      type: object
      description: 统一响应信封公共字段（成功与失败都必填 request_id）
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: '"200" 表示成功；其余为稳定业务错误码'
        message:
          type: string
        request_id:
          type: string
          description: 请求追踪 ID（UUID v4，由中间件生成）

    EmptyEnvelope:
      type: object
      required: [code, message, data, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: "null"
        request_id:
          type: string

    ErrorEnvelope:
      type: object
      required: [code, message, data, request_id]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - TOKEN_ERROR
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - RATE_LIMITED
            - UPSTREAM_ERROR
            - INTERNAL_ERROR
            - HASH_ERROR
        message:
          type: string
        data:
          type: "null"
        request_id:
          type: string

    DeletionConflictEnvelope:
      type: object
      description: |
        409 携带删除影响面的专用信封（D-22）：全局规范 §5 明文例外，仅删除相关端点使用；
        其余 409 仍走 ErrorEnvelope（data 为 null）。
      required: [code, message, data, request_id]
      properties:
        code:
          type: string
          enum: [CONFLICT]
        message:
          type: string
        data:
          $ref: "#/components/schemas/DeletionConflict"
        request_id:
          type: string

    DeletionConflict:
      type: object
      description: 级联删除未确认或状态不允许时的影响面
      required: [impact]
      properties:
        impact:
          type: object
          description: 受影响子对象计数，键按资源复数命名（stages / milestones / tasks）
          additionalProperties:
            type: integer
          example:
            milestones: 3
            tasks: 7
        hint:
          type: string
          description: 提示语，通常指向 `?cascade=true`

    UserResponse:
      type: object
      required: [id, email, display_name]
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT
        user:
          $ref: "#/components/schemas/UserResponse"

    AuthEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/AuthResponse"

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        display_name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RecordItem:
      type: object
      description: 过渡实体，非正式 LearningSession（差异见设计记录/现有接口审计.md）
      required: [id, title, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: ["string", "null"]
        duration_minutes:
          type: ["integer", "null"]
        subject:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RecordListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecordItem"
        total:
          type: integer
          format: int64

    RecordEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/RecordItem"

    RecordListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/RecordListData"

    CreateRecordRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        content:
          type: string
        duration_minutes:
          type: integer
        subject:
          type: string

    UpdateRecordRequest:
      type: object
      description: 部分更新；全部字段可选。正式契约要求区分缺失/null/值（过渡实现当前为二态）
      properties:
        title:
          type: string
        content:
          type: ["string", "null"]
        duration_minutes:
          type: integer
        subject:
          type: ["string", "null"]

    # ==================== 学习规划模块：枚举 ====================

    ProjectStatus:
      type: string
      description: |
        六值合并（D-16 已决策）：PRD §4.3 五态 + ERD §9 的 deleting（受控删除中间态）。
        v1 仅产生前五个值；deleting 为受控彻底删除流程预留（D-02）。
      enum: [draft, active, paused, completed, archived, deleting]

    ProjectType:
      type: string
      description: 项目类型（ERD §5.1）
      enum: [study, skill_development, challenge, deliverable]

    DeadlineType:
      type: string
      description: none 时 deadline_at 必须为空；soft / fixed 时必填（ERD §5.1）
      enum: [none, soft, fixed]

    GoalType:
      type: string
      enum: [outcome, performance, completion]

    GoalStatus:
      type: string
      enum: [active, achieved, cancelled]

    Contribution:
      type: string
      description: 目标-阶段关联的贡献程度（ERD GoalStage）
      enum: [primary, supporting]

    RoadmapStatus:
      type: string
      enum: [draft, active, superseded]

    RoadmapSource:
      type: string
      enum: [user, ai, template]

    StageStatus:
      type: string
      enum: [pending, active, completed, skipped]

    CompletionMethod:
      type: string
      enum: [user, system_confirmed, ai_suggested]

    MilestoneStatus:
      type: string
      enum: [pending, in_progress, completed, skipped]

    TaskStatus:
      type: string
      enum: [todo, in_progress, blocked, completed, cancelled]

    CreatedSource:
      type: string
      enum: [user, ai, template]

    DependencyType:
      type: string
      description: ERD §5.1 仅定义 finish_to_start
      enum: [finish_to_start]

    # ==================== 学习规划模块：项目 ====================

    ProjectItem:
      type: object
      description: 学习项目（ERD §5.1）；owner_id 不外露（隐含为当前用户）
      required: [id, name, project_type, status, importance_level, deadline_type, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ["string", "null"]
        project_type:
          $ref: "#/components/schemas/ProjectType"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        importance_level:
          type: integer
          minimum: 1
          maximum: 5
        importance_override_until:
          type: ["string", "null"]
          format: date-time
        deadline_type:
          $ref: "#/components/schemas/DeadlineType"
        deadline_at:
          type: ["string", "null"]
          format: date-time
        archived_at:
          type: ["string", "null"]
          format: date-time
        reopened_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectItem"
        total:
          type: integer
          format: int64

    ProjectEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ProjectItem"

    ProjectListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ProjectListData"

    CreateProjectRequest:
      type: object
      description: |
        status 不可指定（初始 draft）。省略字段取默认值（D-19）：
        project_type=study、importance_level=3（PRD §5.1 I3「普通」）、deadline_type=none。
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        project_type:
          allOf:
            - $ref: "#/components/schemas/ProjectType"
          default: study
        importance_level:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        importance_override_until:
          type: string
          format: date-time
        deadline_type:
          allOf:
            - $ref: "#/components/schemas/DeadlineType"
          default: none
        deadline_at:
          type: string
          format: date-time

    UpdateProjectRequest:
      type: object
      description: |
        部分更新。status 与 owner 不在可更新字段内（状态变更走动作端点）。
        当前 deadline_type=fixed 的项目改期只能走 POST /projects/{id}/extend-deadline；
        本端点提交此类变更返回 422（D-04 已决策）。
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        project_type:
          $ref: "#/components/schemas/ProjectType"
        importance_level:
          type: integer
          minimum: 1
          maximum: 5
        importance_override_until:
          type: ["string", "null"]
          format: date-time
        deadline_type:
          $ref: "#/components/schemas/DeadlineType"
        deadline_at:
          type: ["string", "null"]
          format: date-time

    ExtendDeadlineRequest:
      type: object
      description: fixed 截止日期改期请求；reason 写入审计事件（D-04 已决策）
      required: [new_deadline_at, reason]
      properties:
        new_deadline_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1

    PurgeProjectRequest:
      type: object
      description: 强制删除项目的二次确认（D-02b）；模拟「输入仓库名」式防误删
      required: [confirm_name]
      properties:
        confirm_name:
          type: string
          minLength: 1
          maxLength: 160
          description: 必须与项目 `name` 完全一致，否则返回 422

    # ==================== 学习规划模块：目标 ====================

    GoalItem:
      type: object
      description: 项目目标（ERD §5.1）
      required: [id, project_id, title, goal_type, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        parent_goal_id:
          type: ["string", "null"]
          format: uuid
          description: |
            上级目标（D-06 已决策：parent_goal_id 自引用，最多两层）。
            为空表示主目标；子目标必须挂在本项目的主目标下，不得跨项目或成环。
        title:
          type: string
        description:
          type: ["string", "null"]
        goal_type:
          $ref: "#/components/schemas/GoalType"
        status:
          $ref: "#/components/schemas/GoalStatus"
        target_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GoalListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GoalItem"
        total:
          type: integer
          format: int64

    GoalEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/GoalItem"

    GoalListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/GoalListData"

    CreateGoalRequest:
      type: object
      description: |
        status 不可指定（初始 active）。parent_goal_id 省略即主目标；
        指定时必须是同项目的主目标（层级上限两层，D-06 已决策）。
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        parent_goal_id:
          type: ["string", "null"]
          format: uuid
        goal_type:
          $ref: "#/components/schemas/GoalType"
        target_at:
          type: string
          format: date-time

    UpdateGoalRequest:
      type: object
      description: |
        部分更新；status 仅允许 active → achieved / cancelled（D-07）。
        parent_goal_id 置 null 即提升为主目标；变更后仍须满足同项目、两层上限、无环。
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        parent_goal_id:
          type: ["string", "null"]
          format: uuid
        goal_type:
          $ref: "#/components/schemas/GoalType"
        target_at:
          type: ["string", "null"]
          format: date-time
        status:
          $ref: "#/components/schemas/GoalStatus"

    GoalStageItem:
      type: object
      description: 目标-阶段关联行（ERD GoalStage，复合主键）；不展开阶段详情
      required: [goal_id, stage_id, contribution]
      properties:
        goal_id:
          type: string
          format: uuid
        stage_id:
          type: string
          format: uuid
        contribution:
          $ref: "#/components/schemas/Contribution"

    GoalStageListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/GoalStageItem"

    ReplaceGoalStageLinksRequest:
      type: object
      description: 目标的完整关联集合；服务端在单事务内整体替换（D-13）
      required: [links]
      properties:
        links:
          type: array
          description: 该目标的全部阶段关联；传空数组即清空
          items:
            $ref: "#/components/schemas/GoalStageLink"

    GoalStageLink:
      type: object
      description: 单条目标-阶段关联
      required: [stage_id, contribution]
      properties:
        stage_id:
          type: string
          format: uuid
        contribution:
          $ref: "#/components/schemas/Contribution"

    # ==================== 学习规划模块：路线与阶段 ====================

    RoadmapItem:
      type: object
      description: 项目路线（版本化，ERD §5.1）
      required: [id, project_id, version, status, source, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        version:
          type: integer
        status:
          $ref: "#/components/schemas/RoadmapStatus"
        source:
          $ref: "#/components/schemas/RoadmapSource"
        change_summary:
          type: ["string", "null"]
        confirmed_at:
          type: ["string", "null"]
          format: date-time
        created_by:
          type: ["string", "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RoadmapListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapItem"
        total:
          type: integer
          format: int64

    RoadmapEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/RoadmapItem"

    RoadmapListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/RoadmapListData"

    CreateRoadmapRequest:
      type: object
      description: version 与 status 由服务端决定；source=ai 须经 AI 提案与用户确认流程（本模块范围外）
      properties:
        source:
          type: string
          enum: [user, template]
        change_summary:
          type: string

    UpdateRoadmapRequest:
      type: object
      description: 仅 draft 可编辑；status 与 version 不可直接修改（status 走 confirm）
      properties:
        change_summary:
          type: ["string", "null"]

    StageItem:
      type: object
      description: 路线阶段（ERD §5.1）
      required: [id, roadmap_id, name, sequence_no, status, completion_method, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        roadmap_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ["string", "null"]
        sequence_no:
          type: integer
        status:
          $ref: "#/components/schemas/StageStatus"
        completion_method:
          $ref: "#/components/schemas/CompletionMethod"
        started_at:
          type: ["string", "null"]
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StageListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/StageItem"

    StageEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/StageItem"

    CreateStageRequest:
      type: object
      description: sequence_no 省略时追加到路线末尾；status 初始 pending
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        sequence_no:
          type: integer

    UpdateStageRequest:
      type: object
      description: 状态必须走动作端点（start / complete / skip / reactivate）
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        sequence_no:
          type: integer

    # ==================== 学习规划模块：里程碑 ====================

    MilestoneItem:
      type: object
      description: 里程碑（ERD §5.1）
      required: [id, stage_id, title, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        stage_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/MilestoneStatus"
        completed_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MilestoneListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MilestoneItem"
        total:
          type: integer
          format: int64

    MilestoneEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/MilestoneItem"

    MilestoneListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/MilestoneListData"

    CreateMilestoneRequest:
      type: object
      description: stage_id 必填（里程碑必属阶段）；status 初始 pending
      required: [stage_id, title]
      properties:
        stage_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string

    UpdateMilestoneRequest:
      type: object
      description: |
        状态迁移按统一规则校验（ADR-007）：允许跳过中间态、允许回退、终态之间不直转、
        同态提交幂等 200；进入 completed 写 completed_at，离开时清空。
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/MilestoneStatus"

    # ==================== 学习规划模块：任务与依赖 ====================

    TaskItem:
      type: object
      description: 学习任务（ERD §5.1）
      required: [id, project_id, title, status, priority, created_source, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        milestone_id:
          type: ["string", "null"]
          format: uuid
        stage_id:
          type: ["string", "null"]
          format: uuid
          description: |
            直接所属阶段（D-05 已决策：模型补列）。与 milestone_id 可同时为空；
            同时存在时阶段必须与里程碑所属阶段一致。
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          type: integer
          minimum: 1
          maximum: 5
        due_at:
          type: ["string", "null"]
          format: date-time
        estimated_minutes:
          type: ["integer", "null"]
          minimum: 0
        completed_at:
          type: ["string", "null"]
          format: date-time
        created_source:
          $ref: "#/components/schemas/CreatedSource"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskItem"
        total:
          type: integer
          format: int64

    TaskEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/TaskItem"

    TaskListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/TaskListData"

    CreateTaskRequest:
      type: object
      description: |
        milestone_id 与 stage_id 均可省略：都省略时任务仅挂项目，只填 stage_id 即直挂阶段
        （D-05 已决策）；created_source 固定 user；status 初始 todo；
        priority 省略时默认 3（D-19）。
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        milestone_id:
          type: string
          format: uuid
        stage_id:
          type: string
          format: uuid
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        due_at:
          type: string
          format: date-time
        estimated_minutes:
          type: integer
          minimum: 0

    UpdateTaskRequest:
      type: object
      description: |
        状态迁移按统一规则校验（ADR-007）：允许跳过中间态、允许回退、终态之间不直转、
        同态提交幂等 200。进入 completed 时服务端写 completed_at，离开时清空；
        started_at 首次写入后不变。milestone_id / stage_id 置 null 即解除该层归属（D-05）。
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        milestone_id:
          type: ["string", "null"]
          format: uuid
        stage_id:
          type: ["string", "null"]
          format: uuid
        priority:
          type: integer
          minimum: 1
          maximum: 5
        due_at:
          type: ["string", "null"]
          format: date-time
        estimated_minutes:
          type: ["integer", "null"]
          minimum: 0
        status:
          $ref: "#/components/schemas/TaskStatus"

    TaskDependencyItem:
      type: object
      description: 任务依赖行（ERD TaskDependency，复合主键，无独立 id）
      required: [task_id, depends_on_task_id, dependency_type]
      properties:
        task_id:
          type: string
          format: uuid
          description: 后继任务
        depends_on_task_id:
          type: string
          format: uuid
          description: 前置任务
        dependency_type:
          $ref: "#/components/schemas/DependencyType"

    TaskDependencyEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/TaskDependencyItem"

    TaskDependencyListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/TaskDependencyItem"

    CreateTaskDependencyRequest:
      type: object
      description: 两任务须同属该项目；禁止自依赖与环路（ERD §5.1）
      required: [depends_on_task_id]
      properties:
        depends_on_task_id:
          type: string
          format: uuid
        dependency_type:
          $ref: "#/components/schemas/DependencyType"

    # ==================== 学习内容域：枚举 ====================

    ContentType:
      type: string
      description: ERD §5.2 三值；子类型 v1 不入模型（D-23）
      enum: [knowledge_point, skill_point, language_item]

    ContentStatus:
      type: string
      description: 归档由 DELETE 驱动，PATCH 不接受该字段；不提供取消归档
      enum: [active, archived]

    BodyFormat:
      type: string
      description: 正文解释方式；未知值按 plain_text 渲染，不报错（ADR-009 §6）
      enum: [markdown, plain_text]

    ContentCreatedSource:
      type: string
      description: |
        与阶段/路线的 `CreatedSource`（user / ai / template）**刻意不同**：内容的 AI 产物只在提案
        被接受后落库，落库即已确认，不存在「未确认的 AI 内容行」（ADR-009 §7）。
      enum: [user, ai_confirmed, template]

    RelationType:
      type: string
      description: |
        `prerequisite` 有向且禁止成环；`related` / `alternative` 语义对称，但**只存一行**，
        查询时展开为双向（D-25）。
      enum: [prerequisite, related, contains, extends, alternative]

    ProjectContentStatus:
      type: string
      description: achieved 只能由 M06 评价流程写入（D-27）
      enum: [not_started, learning, reviewing, achieved, waived]

    # ==================== 学习内容域：内容本体 ====================

    ContentItem:
      type: object
      description: 列表视图；**不含 `body`**（ADR-009 §2：列表可能一次 100 条 × 100KB）
      required:
        - id
        - title
        - content_type
        - status
        - body_format
        - created_source
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        description:
          type: ["string", "null"]
          maxLength: 500
        content_type:
          $ref: "#/components/schemas/ContentType"
        parent_id:
          type: ["string", "null"]
          format: uuid
        source_url:
          type: ["string", "null"]
          format: uri
          maxLength: 2048
        status:
          $ref: "#/components/schemas/ContentStatus"
        body_format:
          $ref: "#/components/schemas/BodyFormat"
        created_source:
          $ref: "#/components/schemas/ContentCreatedSource"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ContentDetailItem:
      allOf:
        - $ref: "#/components/schemas/ContentItem"
        - type: object
          required: [body, depth]
          properties:
            body:
              type: ["string", "null"]
              maxLength: 100000
              description: 正文源文本（Markdown / 纯文本），后端不渲染不净化
            depth:
              type: integer
              minimum: 0
              description: 树深度，根节点为 0；「4–5 层」仅为界面建议，服务层硬上限 10

    ContentListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentItem"
        total:
          type: integer
          format: int64

    ContentListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ContentListData"

    ContentEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ContentDetailItem"

    ContentHint:
      type: object
      description: 相似内容提示（D-24：pg_trgm similarity > 0.4，同类型，取前 5）
      required: [id, title, similarity]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        similarity:
          type: number
          minimum: 0
          maximum: 1

    ContentCreateData:
      type: object
      description: 创建结果；`similar_hints` 为空表示没有相近内容，**不影响创建成功**
      required: [item, similar_hints]
      properties:
        item:
          $ref: "#/components/schemas/ContentDetailItem"
        similar_hints:
          type: array
          items:
            $ref: "#/components/schemas/ContentHint"

    ContentCreateEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ContentCreateData"

    CreateContentRequest:
      type: object
      description: 字段 `metadata` 不可写（出现即 422）；`status` 恒为 active；`created_source` 由服务端决定
      required: [title, content_type]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content_type:
          $ref: "#/components/schemas/ContentType"
        description:
          type: ["string", "null"]
          maxLength: 500
        body:
          type: ["string", "null"]
          maxLength: 100000
          description: 空串归一为 NULL
        body_format:
          $ref: "#/components/schemas/BodyFormat"
        source_url:
          type: ["string", "null"]
          format: uri
          maxLength: 2048
          description: 仅允许 http / https
        parent_id:
          type: ["string", "null"]
          format: uuid

    UpdateContentRequest:
      type: object
      description: |
        部分更新（三态：缺失＝不变 / null＝置空 / 值＝更新）。`status`、`created_source`、
        `metadata` 不在可更新字段内。改 `parent_id` 会校验同归属、不成环、深度 ≤ 10。
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: ["string", "null"]
          maxLength: 500
        body:
          type: ["string", "null"]
          maxLength: 100000
        body_format:
          $ref: "#/components/schemas/BodyFormat"
        source_url:
          type: ["string", "null"]
          format: uri
          maxLength: 2048
        parent_id:
          type: ["string", "null"]
          format: uuid
          description: null 表示移到根节点
        content_type:
          $ref: "#/components/schemas/ContentType"

    # ==================== 学习内容域：内容关系 ====================

    RelationItem:
      type: object
      required: [id, source_content_id, target_content_id, relation_type, direction]
      properties:
        id:
          type: string
          format: uuid
        source_content_id:
          type: string
          format: uuid
        target_content_id:
          type: string
          format: uuid
        relation_type:
          $ref: "#/components/schemas/RelationType"
        direction:
          type: string
          description: 相对查询锚点的方向（outbound 该内容为 source / inbound 为 target）
          enum: [outbound, inbound]

    RelationListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RelationItem"
        total:
          type: integer
          format: int64

    RelationListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/RelationListData"

    RelationEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/RelationItem"

    CreateRelationRequest:
      type: object
      description: 源内容取自路径；目标内容与源内容必须同属当前用户
      required: [target_content_id, relation_type]
      properties:
        target_content_id:
          type: string
          format: uuid
        relation_type:
          $ref: "#/components/schemas/RelationType"

    # ==================== 学习内容域：标签 ====================

    ContentTagItem:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 60
        color:
          type: ["string", "null"]
          maxLength: 20
          description: 仅展示用
        created_at:
          type: string
          format: date-time

    ContentTagListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentTagItem"
        total:
          type: integer
          format: int64

    ContentTagListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ContentTagListData"

    ContentTagEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ContentTagItem"

    CreateContentTagRequest:
      type: object
      description: 同一用户下标签名唯一（`UNIQUE(owner_id, name)`），重名返回 409
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: ["string", "null"]
          maxLength: 20

    UpdateContentTagRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: ["string", "null"]
          maxLength: 20

    SetContentTagsRequest:
      type: object
      description: 整体替换语义；空数组表示清空该内容的全部标签
      required: [tag_ids]
      properties:
        tag_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid

    # ==================== 学习内容域：项目内容关联 ====================

    ProjectContentItem:
      type: object
      description: 内容在某个项目里的上下文；状态是项目级的，同一内容可在两个项目里状态不同
      required:
        - id
        - project_id
        - content_id
        - current_status
        - target_mastery_level
        - priority
        - auto_review_enabled
        - linked_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        current_status:
          $ref: "#/components/schemas/ProjectContentStatus"
        target_mastery_level:
          type: integer
          minimum: 0
          maximum: 4
        priority:
          type: integer
          minimum: 1
          maximum: 5
        auto_review_enabled:
          type: boolean
        linked_at:
          type: string
          format: date-time
        achieved_at:
          type: ["string", "null"]
          format: date-time
          description: 进入 achieved 时写入；离开 achieved 后保留（「曾经达成」）

    ProjectContentListData:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectContentItem"
        total:
          type: integer
          format: int64

    ProjectContentListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ProjectContentListData"

    ProjectContentEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ProjectContentItem"

    CreateProjectContentRequest:
      type: object
      description: |
        默认值：`current_status=not_started`、`target_mastery_level=0`、`priority=3`、
        `auto_review_enabled=false`、`linked_at=now()`。项目与内容任一非本人 → 404。
      required: [project_id, content_id]
      properties:
        project_id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        target_mastery_level:
          type: integer
          minimum: 0
          maximum: 4
        priority:
          type: integer
          minimum: 1
          maximum: 5
        auto_review_enabled:
          type: boolean

    UpdateProjectContentRequest:
      type: object
      description: |
        `current_status` 只接受 `not_started` / `learning` / `reviewing` / `waived`；提交
        `achieved` 返回 409（掌握结论由 M06 评价流程写入，D-27）。同态提交幂等且不刷新
        `updated_at`。
      properties:
        current_status:
          type: string
          enum: [not_started, learning, reviewing, waived]
        target_mastery_level:
          type: integer
          minimum: 0
          maximum: 4
        priority:
          type: integer
          minimum: 1
          maximum: 5
        auto_review_enabled:
          type: boolean
