name: learna

services:
  # 数据库
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: ${POSTGRES_DB:-learna}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learna}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    ports:
      - "5433:5432"

  # 后端
  backend:
    build: ../backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-learna}:${POSTGRES_PASSWORD:-devpass}@postgres:5432/${POSTGRES_DB:-learna}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      AI_SERVICE_BASE_URL: http://ai-service:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      STORAGE_PROVIDER: local
      STORAGE_ROOT_DIR: /data/uploads
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped

  # AI服务器
  ai-service:
    build: ../ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ../frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
