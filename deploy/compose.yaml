# 正式部署全栈（生产密钥无默认值，缺失即报错）
# 用法（仓库根目录）：docker compose --env-file .env -f deploy/compose.yaml up -d
name: learna

services:
  # 数据库
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD（生产密钥禁止使用默认值）}
      POSTGRES_DB: ${POSTGRES_DB:-learna}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learna}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  # 后端
  backend:
    build: ../backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-learna}:${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD（生产密钥禁止使用默认值）}@postgres:5432/${POSTGRES_DB:-learna}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      AI_SERVICE_BASE_URL: http://ai-service:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?必须设置 AI_SERVICE_TOKEN（内部服务鉴权密钥，禁止留空）}
      STORAGE_PROVIDER: local
      STORAGE_ROOT_DIR: /data/uploads
      RUST_LOG: ${RUST_LOG:-info}
      JWT_SECRET: ${JWT_SECRET:?必须设置 JWT_SECRET（生产密钥禁止使用默认值）}
    restart: unless-stopped

  # AI服务器
  ai-service:
    build: ../ai-service
    environment:
      # 未配置即启动失败（fail-closed），不允许以无鉴权状态对外暴露 /internal
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?必须设置 AI_SERVICE_TOKEN（内部服务鉴权密钥，禁止留空）}
    expose:
      - "8001"
    restart: unless-stopped

  frontend:
    build: ../frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
